[workspace]
members = [
  "crates/tuckmark-contracts",
  "crates/tuckmark-engine",
  "crates/tuckmark-cli",
]
exclude = ["tools/detonger-preview-encoder"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.218", features = ["derive"] }
serde_json = { version = "1.0.139", features = ["preserve_order"] }
thiserror = "2.0.11"
uuid = { version = "1.14.0", features = ["serde", "v4"] }
