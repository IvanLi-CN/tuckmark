[package]
name = "tuckmark-devd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
futures-util = "0.3.31"
http = "1.2.0"
http-body-util = "0.1.2"
libc = "0.2.172"
mime_guess = "2.0.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3.37", features = ["formatting", "parsing"] }
tokio = { version = "1.43.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = { version = "0.5.2", features = ["util"] }
uuid.workspace = true
tuckmark-contracts = { path = "../tuckmark-contracts" }
tuckmark-engine = { path = "../tuckmark-engine" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.16.0"
