name: release

on:
  workflow_run:
    workflows: ["ci-main"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Exact trusted workflow run that produced the release intent."
        required: true
        type: string
      source_artifact_name:
        description: "Exact release-intent artifact name from the source run."
        required: true
        type: string
      intent_id:
        description: "Exact stable release intent identifier."
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: Release Prepare
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      channel_label: ${{ steps.plan.outputs.channel_label }}
      context_artifact_name: ${{ steps.release-notes.outputs.artifact_name }}
      intent_id: ${{ steps.plan.outputs.intent_id }}
      merge_sha: ${{ steps.plan.outputs.merge_sha }}
      release_version: ${{ steps.plan.outputs.release_version }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - id: snapshot
        name: Select release snapshot
        run: node .github/scripts/select-release-snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore release snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.snapshot.outputs.artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.snapshot.outputs.run_id }}
          github-token: ${{ github.token }}
          path: work/release/inbox
      - name: Normalize release snapshot
        run: |
          SNAPSHOT="$(find work/release/inbox -name release-intent.json -print -quit)"
          test -n "$SNAPSHOT"
          mkdir -p work/release
          cp "$SNAPSHOT" work/release/release-intent.json
      - id: tag-reservation
        name: Discover release tag reservation
        run: node .github/scripts/release-tag-reservation.mjs discover
      - id: plan
        name: Build release plan
        run: |
          node .github/scripts/release-plan.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const plan = JSON.parse(fs.readFileSync("work/release/release-plan.json", "utf8"))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `intent_id=${plan.intent_id ?? ""}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `merge_sha=${plan.merge_sha}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_version=${plan.release_version}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel_label=${plan.channel_label ?? ""}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${plan.type_label !== "type:none"}\n`)
          NODE
        env:
          TUCKMARK_RELEASE_INTENT_ID: ${{ inputs.intent_id }}
          TUCKMARK_RESERVED_RELEASE_VERSION: ${{ steps.tag-reservation.outputs.release_version }}
      - name: Reject published release-intent replay
        if: steps.plan.outputs.should_publish == 'true'
        run: node .github/scripts/release-publication-guard.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: release-notes
        name: Render release notes and context
        run: node .github/scripts/release-notes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload release context artifact
        if: steps.plan.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-notes.outputs.artifact_name }}
          path: |
            work/release/release-context.json
            work/release/release-notes.md
          if-no-files-found: error

  build-host-tools:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    name: Host Tools / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.merge_sha }}
          fetch-depth: 1
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Linux detonger build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build standalone host tools
        run: >-
          bun run build:host-tools --
          --target ${{ matrix.target }}
          --out-dir work/release/host-tools
          --version ${{ needs.prepare.outputs.release_version }}
          --sha ${{ needs.prepare.outputs.merge_sha }}
      - name: Verify isolated host tools
        run: >-
          node scripts/verify-host-tools.mjs
          --release-root work/release/host-tools
          --target ${{ matrix.target }}
          --version ${{ needs.prepare.outputs.release_version }}
          --sha ${{ needs.prepare.outputs.merge_sha }}
      - name: Archive host tools for permission-preserving transfer
        shell: bash
        run: |
          mkdir -p work/release/transfer
          tar -C work/release/host-tools -czf "work/release/transfer/tuckmark-${{ matrix.target }}.tar.gz" "tuckmark-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools-${{ matrix.target }}
          path: work/release/transfer/tuckmark-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build-host-tools]
    if: needs.prepare.outputs.should_publish == 'true'
    name: Release Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_version: ${{ needs.prepare.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep release controls at the trusted workflow revision. Build outputs and
          # the reservation tag remain explicitly bound to the historical target SHA.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore release context
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.context_artifact_name }}
          path: work/release/context
      - name: Restore platform host tools
        uses: actions/download-artifact@v4
        with:
          pattern: host-tools-*
          merge-multiple: true
          path: work/release/transfer
      - name: Rehydrate and verify transferred host tools
        run: |
          mkdir -p work/release/host-tools
          for target in darwin-arm64 darwin-x64 linux-x64 windows-x64; do
            tar -xzf "work/release/transfer/tuckmark-${target}.tar.gz" -C work/release/host-tools
          done
          node scripts/verify-host-tools.mjs \
            --release-root work/release/host-tools \
            --target linux-x64 \
            --version "${{ needs.prepare.outputs.release_version }}" \
            --sha "${{ needs.prepare.outputs.merge_sha }}"
      - name: Archive host tools and write checksums
        run: |
          mkdir -p work/release/assets
          for target in darwin-arm64 darwin-x64 linux-x64; do
            tar -C work/release/host-tools -czf "work/release/assets/tuckmark-host-tools-${target}.tar.gz" "tuckmark-${target}"
          done
          (
            cd work/release/host-tools
            zip -qr "../assets/tuckmark-host-tools-windows-x64.zip" "tuckmark-windows-x64"
          )
          (
            cd work/release/assets
            sha256sum tuckmark-host-tools-* > SHA256SUMS
          )
      - name: Reserve exact release tag
        run: |
          VERSION="${{ needs.prepare.outputs.release_version }}"
          MERGE_SHA="${{ needs.prepare.outputs.merge_sha }}"
          INTENT_ID="${{ needs.prepare.outputs.intent_id }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$VERSION" "$MERGE_SHA" --message "tuckmark-release-intent:$INTENT_ID"
            git push origin "refs/tags/$VERSION"
          fi
          node .github/scripts/release-tag-reservation.mjs verify
        env:
          TUCKMARK_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          TUCKMARK_RELEASE_INTENT_ID: ${{ needs.prepare.outputs.intent_id }}
          TUCKMARK_RELEASE_MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
      - name: Create or resume release draft
        run: |
          VERSION="${{ needs.prepare.outputs.release_version }}"
          if gh release view "$VERSION" --json tagName,targetCommitish,name,isDraft,isPrerelease,body,assets > work/release/release-draft.json 2>/dev/null; then
            node .github/scripts/release-draft.mjs
            exit 0
          fi
          RELEASE_ARGS=()
          if [ "${{ needs.prepare.outputs.channel_label }}" = "channel:preview" ]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file work/release/context/release-notes.md \
            --draft \
            --verify-tag \
            "${RELEASE_ARGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TUCKMARK_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          TUCKMARK_RELEASE_INTENT_ID: ${{ needs.prepare.outputs.intent_id }}
          TUCKMARK_RELEASE_CHANNEL_LABEL: ${{ needs.prepare.outputs.channel_label }}
          TUCKMARK_RELEASE_MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
      - name: Upload release assets
        run: >-
          gh release upload "${{ needs.prepare.outputs.release_version }}"
          work/release/assets/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify draft release assets
        run: |
          gh release view "${{ needs.prepare.outputs.release_version }}" --json tagName,targetCommitish,name,isDraft,isPrerelease,body,assets > work/release/release-draft.json
          node .github/scripts/release-draft.mjs verify-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TUCKMARK_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          TUCKMARK_RELEASE_INTENT_ID: ${{ needs.prepare.outputs.intent_id }}
          TUCKMARK_RELEASE_CHANNEL_LABEL: ${{ needs.prepare.outputs.channel_label }}
          TUCKMARK_RELEASE_MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
      - name: Publish GitHub Release
        run: gh release edit "${{ needs.prepare.outputs.release_version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  post-publish-smoke:
    needs: [prepare, publish]
    name: Release Smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.merge_sha }}
          fetch-depth: 1
      - name: Download and verify published release assets
        run: |
          mkdir -p work/release/download
          gh release download "${{ needs.publish.outputs.release_version }}" \
            --pattern 'tuckmark-host-tools-*' \
            --pattern SHA256SUMS \
            --dir work/release/download
          (
            cd work/release/download
            sha256sum --check SHA256SUMS
            tar -xzf tuckmark-host-tools-linux-x64.tar.gz
          )
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Smoke the downloaded Linux host tools
        run: >-
          node scripts/verify-host-tools.mjs
          --release-root work/release/download
          --target linux-x64
          --version ${{ needs.publish.outputs.release_version }}
          --sha ${{ needs.prepare.outputs.merge_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install browser smoke dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Smoke the packaged DEVD PWA
        run: >-
          node scripts/verify-packaged-devd-pwa.mjs
          --devd work/release/download/tuckmark-linux-x64/bin/tuckmark-devd
      - name: Install only the released Skills from the downloaded archive
        run: >-
          node scripts/verify-release-skills.mjs
          --release-root work/release/download/tuckmark-linux-x64

  pages:
    needs: [prepare, post-publish-smoke]
    name: Refresh Pages release metadata
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch Pages from main
        run: gh workflow run pages.yml --ref main -f release_tag="${{ needs.prepare.outputs.release_version }}"
        env:
          GH_TOKEN: ${{ github.token }}
