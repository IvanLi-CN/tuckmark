name: release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci-main"]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native binaries
        run: cargo build --locked --release --target ${{ matrix.target }} --bin tuckmark --bin tuckmark-devd
      - name: Ad-hoc sign and package
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/tuckmark-cli/Cargo.toml | head -1)"
          root="tuckmark-${version}-${{ matrix.target }}"
          mkdir -p "$root"
          cp "target/${{ matrix.target }}/release/tuckmark" "target/${{ matrix.target }}/release/tuckmark-devd" "$root/"
          codesign --force --sign - "$root/tuckmark" "$root/tuckmark-devd"
          tar -czf "${root}.tar.gz" "$root"
          shasum -a 256 "${root}.tar.gz" > SHA256SUMS
          echo "archive=${root}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Artifact smoke test without JavaScript runtime
        run: bash scripts/test-native-release-artifact.sh "${{ steps.package.outputs.archive }}" ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            SHA256SUMS

  publish:
    needs: native
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release
      - name: Publish native release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(find release -name 'tuckmark-*.tar.gz' -print -quit | sed -E 's#release/tuckmark-([0-9.]+)-.*#\1#')"
          gh release create "$version" release/*.tar.gz release/SHA256SUMS --title "$version" --generate-notes
