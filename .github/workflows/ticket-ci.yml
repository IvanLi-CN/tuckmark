name: ticket-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-unit-and-golden-tests:
    name: rust-unit-and-golden-tests
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev fonts-noto-cjk
      - name: Verify immutable compatibility contracts
        run: node scripts/check-compatibility-contract.mjs
      - name: Run Rust unit and golden tests
        run: cargo test --workspace --locked
