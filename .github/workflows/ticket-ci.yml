name: ticket-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-unit-and-golden-tests:
    name: rust-unit-and-golden-tests
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev fonts-noto-cjk
      - name: Verify immutable compatibility contracts
        run: node scripts/check-compatibility-contract.mjs
      - name: Run Rust unit and golden tests
        run: cargo test --workspace --locked

  cli-black-box-parity:
    name: cli-black-box-parity
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Install native preview dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev fonts-noto-cjk
      - name: Run CLI black-box parity
        run: cargo test -p tuckmark-cli --test black_box_parity --locked

  http-ipc-web-contract-tests:
    name: http-ipc-web-contract-tests
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev fonts-noto-cjk
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Verify immutable compatibility contracts
        run: node scripts/check-compatibility-contract.mjs
      - name: Run Rust HTTP and IPC contract tests
        run: cargo test --locked --package tuckmark-devd
      - name: Run Web server-HTTP contract harness
        run: bun run --filter @tuckmark/web test:e2e:sync

  windows-named-ipc-contract:
    name: windows-named-ipc-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Run Windows named IPC contract tests
        run: cargo test --locked --package tuckmark-devd --test http_ipc_contract windows_named_ipc
